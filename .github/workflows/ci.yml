name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 1.22 test binaries can fail to load on macOS 26 (missing LC_UUID).
          go-version: '1.27.x'
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
      - name: Unit and process integration tests
        run: go test -count=1 -timeout=3m ./...
      - name: Race detector
        run: go test -race -count=1 -timeout=3m ./...
      - run: go vet ./...
      - run: go build ./cmd/kiro-cli-login-watchdog
